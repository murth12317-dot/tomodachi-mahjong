<title>友達麻雀 一人打ち</title>
<meta name="theme-color" content="#0f3d2e">
<style>
:root {
  --felt: #16553f;
  --felt-dark: #0f3d2e;
  --felt-line: #1f6b50;
  --ink: #1b1b1b;
  --tile: #fbf8ef;
  --tile-edge: #d9d2bd;
  --tile-side: #e8b04a;
  --back: #e0902d;
  --man: #c0262d;
  --pin: #1f5aa6;
  --sou: #1d7a3a;
  --accent: #ffcf4a;
  --text: #f3f1ea;
  --muted: #b9c9c0;
  --hw: 42px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; height: var(--appH, 100%); }
body {
  background: radial-gradient(circle at 50% 35%, var(--felt) 0%, var(--felt-dark) 75%);
  color: var(--text);
  font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", Meiryo, system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  user-select: none;
}
.hidden { display: none !important; }
button {
  font: inherit; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer;
  background: #2c7a5c; color: #fff; font-weight: 600;
}
button:hover { filter: brightness(1.1); }
button.primary { background: var(--accent); color: #3a2a00; }
button.small { padding: 6px 12px; font-size: 13px; }
button.ghost { background: transparent; color: var(--muted); text-decoration: underline; }
input[type=text], input:not([type]), input[inputmode] {
  font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid #2d6a55;
  background: #0c2f23; color: var(--text); width: 100%;
}

/* ---- ロビー・待合室 ---- */
.screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
.card {
  width: min(420px, 100%); background: rgba(0, 0, 0, .28); border: 1px solid rgba(255, 255, 255, .08);
  border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
}
h1 { margin: 0; font-size: 30px; letter-spacing: .1em; text-align: center; }
.sub { margin: 0; color: var(--muted); font-size: 13px; text-align: center; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
label.inline { flex-direction: row; align-items: center; gap: 4px; color: var(--text); font-size: 14px; }
.row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.row input { flex: 1; }
.divider { text-align: center; color: var(--muted); font-size: 12px; border-top: 1px solid rgba(255,255,255,.1); margin-top: 6px; }
.divider span { position: relative; top: -9px; background: #123f30; padding: 0 8px; }
.msg { min-height: 1.2em; margin: 0; color: #ffb4a8; text-align: center; font-size: 13px; }
.code { font-size: 48px; font-weight: 800; letter-spacing: .2em; text-align: center; color: var(--accent); }
#seats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
#seats li {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px;
  background: rgba(255, 255, 255, .06);
}
#seats li .nm { flex: 1; }
#seats li .dot { width: 8px; height: 8px; border-radius: 50%; background: #6c6; }
#seats li .dot.off { background: #777; }
#seats li.empty { color: var(--muted); font-style: italic; }
.tag { font-size: 11px; padding: 2px 6px; border-radius: 6px; background: rgba(255,255,255,.12); }

/* ---- 牌 ---- */
.tile {
  --w: 28px;
  width: var(--w); height: calc(var(--w) * 1.36);
  background: var(--tile); border-radius: calc(var(--w) * .12);
  box-shadow: inset 0 calc(var(--w) * -.06) 0 var(--tile-edge), 0 calc(var(--w) * .07) 0 var(--tile-side), 0 2px 3px rgba(0,0,0,.35);
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--ink); line-height: 1; position: relative; flex: none;
  font-weight: 700; font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
}
.tile .n { font-size: calc(var(--w) * .56); }
.tile .s { font-size: calc(var(--w) * .38); margin-top: calc(var(--w) * .06); }
.tile.m .s { color: var(--man); }
.tile.p .n { color: var(--pin); }
.tile.p .s { color: var(--pin); }
.tile.s .n { color: var(--sou); }
.tile.s .s { color: var(--sou); }
.tile.z .n { font-size: calc(var(--w) * .72); }
.tile.hatsu .n { color: var(--sou); }
.tile.chun .n { color: var(--man); }
.tile.haku .n { width: 58%; height: 62%; border: calc(var(--w) * .06) solid #3b7bd0; border-radius: 3px; }
.tile.c-red .n { color: var(--man) !important; }
.tile.c-gold { background: linear-gradient(160deg, #fff6c9, #f1cf5b); }
.tile.c-gold .n { color: #8a6200 !important; }
.tile.c-blue { background: linear-gradient(160deg, #e6f1ff, #a9cdf7); }
.tile.c-blue .n { color: #1845a0 !important; }
.tile.c-rainbow { background: linear-gradient(135deg, #ffd0d0, #fff3b0, #c9f5c9, #c7e3ff, #e6ccff); }
.tile.c-rainbow .n { color: #6a1b9a !important; }
.tile.c-red::after, .tile.c-gold::after, .tile.c-blue::after, .tile.c-rainbow::after, .tile.pocchi::after {
  content: ""; position: absolute; top: calc(var(--w) * .08); right: calc(var(--w) * .08);
  width: calc(var(--w) * .18); height: calc(var(--w) * .18); border-radius: 50%; }
.tile.c-red::after { background: var(--man); }
.tile.c-gold::after { background: #d4a106; }
.tile.c-blue::after { background: #2f6fd6; }
.tile.c-rainbow::after { background: conic-gradient(red, orange, yellow, green, blue, violet, red); }
.tile.pocchi::after { display: none; }
.tile.back { background: linear-gradient(160deg, #f0a543, var(--back)); box-shadow: 0 calc(var(--w) * .07) 0 #f6f1e1, 0 2px 3px rgba(0,0,0,.35); }
.tile.side { transform: rotate(90deg); margin: 0 calc(var(--w) * .18); }
.tile.dim { filter: brightness(.85); }
.tile.last { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---- 対局画面 ---- */
#table { flex-direction: column; justify-content: flex-start; padding: 0; width: 100%; overflow: hidden; }
#boardWrap { flex: 1; width: 100%; position: relative; overflow: hidden; min-height: 0; }
#board { width: 600px; height: 600px; position: absolute; left: 50%; top: 50%; transform-origin: center center; }
#board::before {
  content: ""; position: absolute; inset: 8px; border-radius: 22px; border: 1px solid var(--felt-line);
}
.center {
  position: absolute; left: 210px; top: 210px; width: 180px; height: 180px; border-radius: 14px;
  background: rgba(0, 0, 0, .35); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font-size: 13px; z-index: 2; gap: 1px; padding-bottom: 2px;
}
.center .rt { font-size: 16px; font-weight: 800; letter-spacing: .05em; }
.center .wall { color: var(--muted); }
.center .dora { display: flex; gap: 2px; margin-top: 2px; }
.center .sticks { color: var(--muted); font-size: 10px; white-space: nowrap; }
.side[data-rel] { position: absolute; inset: 0; pointer-events: none; }
.side .lbl {
  position: absolute; left: 210px; top: 344px; width: 180px; height: 46px; z-index: 3;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 4px;
  font-size: 11px; line-height: 1.15;
}
.side .lbl .sc { font-size: 13px; font-weight: 800; }
.side .lbl .w { color: var(--accent); font-weight: 800; margin-right: 4px; }
.side .lbl.turn .sc { color: var(--accent); }
.side .lbl .rstick { position: absolute; top: -8px; width: 70px; height: 6px; border-radius: 3px; background: #fff; }
.side .lbl .rstick::after { content: ""; position: absolute; left: 31px; top: 1px; width: 4px; height: 4px; border-radius: 50%; background: var(--man); }
.side .lbl .off { color: #ff9f8a; font-size: 10px; }
.pond { position: absolute; left: 213px; top: 396px; display: flex; flex-direction: column; gap: 2px; }
.pond .prow { display: flex; align-items: center; height: 40px; }
.pond .tile { --w: 28px; }
.ohand { position: absolute; left: 40px; right: 40px; top: 560px; display: flex; justify-content: center; align-items: flex-end; gap: 10px; }
.ohand .backs { display: flex; gap: 1px; }
.ohand .tile { --w: 22px; }
.ohand .ms { display: flex; gap: 6px; align-items: flex-end; }
.ohand .ms .tile { --w: 20px; }
.meld { display: flex; align-items: flex-end; gap: 1px; }
.side[data-rel="1"] { transform: rotate(-90deg); }
.side[data-rel="2"] { transform: rotate(180deg); }
.side[data-rel="3"] { transform: rotate(90deg); }
.claimFlash { position: absolute; left: 0; right: 0; top: 430px; display: flex; justify-content: center; z-index: 6; pointer-events: none; --c1: #fff; --c2: #d33; }

#me { width: 100%; max-width: 100%; overflow: hidden; padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 6px; }
#actions { display: flex; gap: 8px; min-height: 42px; flex-wrap: wrap; justify-content: center; align-items: center; }
#actions button { min-width: 72px; font-size: 16px; padding: 9px 14px; background: #fff; color: #222; box-shadow: 0 3px 0 #999; }
#actions button.win { background: #e23b3b; color: #fff; box-shadow: 0 3px 0 #8a1d1d; }
#actions button.riichi { background: #ffcf4a; box-shadow: 0 3px 0 #a07d17; }
#actions button.pass { background: #3b4a44; color: #eee; box-shadow: 0 3px 0 #1c2521; }
#actions button.opt { display: inline-flex; gap: 2px; align-items: center; padding: 6px 10px; }
#actions button.opt .tile { --w: 22px; }
#actions .hint { color: var(--accent); font-size: 13px; }
#handRow { display: flex; align-items: flex-end; gap: 12px; max-width: 100%; }
#hand { display: flex; gap: 2px; align-items: flex-end; }
#hand .tile { --w: var(--hw); cursor: pointer; transition: transform .08s; }
#hand .tile.drawn { margin-left: calc(var(--hw) * .35); }
#hand .tile:hover:not(.ng) { transform: translateY(-6px); }
#hand .tile.ng { filter: brightness(.55); cursor: default; }
#hand .tile.ok { box-shadow: inset 0 calc(var(--w) * -.06) 0 var(--tile-edge), 0 calc(var(--w) * .07) 0 var(--tile-side), 0 0 0 3px var(--accent); }
#myMelds { display: flex; gap: 6px; align-items: flex-end; }
#myMelds .tile { --w: calc(var(--hw) * .72); }
#status { font-size: 12px; color: var(--muted); min-height: 16px; display: flex; gap: 6px; align-items: center; }
#status .tile { --w: 18px; }
#opts { position: absolute; right: 10px; top: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
#opts label { flex-direction: row; align-items: center; gap: 4px; color: var(--muted); }
#opts select { font-size: 12px; padding: 1px 2px; width: auto; background: rgba(0,0,0,.35); color: inherit; border: 1px solid rgba(255,255,255,.2); border-radius: 4px; }

/* ---- モーダル ---- */
#modal { position: fixed; left: 0; right: 0; top: 0; height: var(--appH, 100%); background: rgba(0, 0, 0, .55); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 12px; }
#modalBody {
  width: min(560px, 100%); max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; user-select: text; background: #102f25; border: 1px solid #2e7059;
  border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px;
}
#modalBody h2 { margin: 0; text-align: center; font-size: 22px; }
#modalBody h3 { margin: 0; font-size: 16px; color: var(--accent); }
.win { display: flex; flex-direction: column; gap: 8px; }
.wtiles { display: flex; gap: 2px; flex-wrap: nowrap; align-items: flex-end; justify-content: center; }
.wtiles .tile { --w: var(--tw, 26px); }
.wtiles .gap { width: 6px; flex: none; }
.yakulist { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; font-size: 14px; }
.total { font-size: 18px; font-weight: 800; text-align: right; }
.doras { display: flex; gap: 12px; font-size: 12px; color: var(--muted); align-items: center; flex-wrap: wrap; }
.doras .tile { --w: 20px; }
table.sc { width: 100%; border-collapse: collapse; font-size: 14px; }
table.sc td { padding: 6px 4px; border-top: 1px solid rgba(255,255,255,.08); }
table.sc td.num { text-align: right; font-variant-numeric: tabular-nums; }
.plus { color: #7ee08a; } .minus { color: #ff9b8a; }
.history { margin-top: 14px; text-align: left; }
.history h3 { font-size: 15px; margin: 0 0 6px; }
.histDetail { margin-top: 8px; font-size: 14px; }
.histDetail summary { cursor: pointer; color: var(--accent); padding: 4px 0; }
.histNo { margin-top: 8px; font-size: 12px; color: var(--muted); }
.tenpaiHands { display: flex; flex-direction: column; gap: 6px; }
#toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: #222; color: #fff; padding: 8px 14px; border-radius: 8px; z-index: 30; font-size: 14px; }

@media (max-width: 700px) {
  #opts { top: auto; bottom: 150px; right: 6px; }
  #actions button { min-width: 60px; font-size: 15px; padding: 8px 10px; }
}

/* ---- 新ルール用 ---- */
.side .lbl .chip { font-size: 11px; color: var(--accent); }
.openWaits { position: absolute; left: 398px; top: 398px; width: 156px; display: flex; flex-direction: column; gap: 3px; font-size: 12px; font-weight: 800; color: #ffd0c4; z-index: 4;
  background: rgba(0,0,0,.45); border: 1px solid rgba(255,140,120,.6); border-radius: 8px; padding: 4px 6px; }
.openWaits .ows { display: flex; flex-wrap: wrap; gap: 1px; align-items: flex-end; }
.openWaits .ows .tile { --w: 22px; }
.openWaits .oww { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; color: #ffe08a; }
.openWaits .oww .tile { --w: 16px; }
.cands { display: flex; flex-direction: column; gap: 8px; }
button.cand { text-align: left; background: #173f31; border: 1px solid #2e7059; display: flex; flex-direction: column; gap: 4px; }
button.cand .ct { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
button.cand .cd { font-weight: 800; }
button.cand .cv { color: var(--accent); }
button.cand .cy { font-size: 12px; color: var(--muted); font-weight: 400; }
.tag.gold { background: #d4a106; color: #221800; }
.chipline { font-weight: 800; color: var(--accent); text-align: right; }
.units { font-size: 12px; color: var(--muted); }
table.sc td.hd { font-size: 11px; color: var(--muted); }

/* 牌の絵柄（SVG） */
.tile svg { width: 86%; height: 88%; display: block; }
.tile.side svg { width: 86%; }

/* 特殊な5をはっきり区別する：色つきの枠＋背景 */
.tile.c-red, .tile.c-gold, .tile.c-blue {
  box-shadow: inset 0 0 0 calc(var(--w) * .09) var(--frame), inset 0 calc(var(--w) * -.06) 0 var(--tile-edge), 0 calc(var(--w) * .07) 0 var(--tile-side), 0 2px 3px rgba(0,0,0,.35);
}
.tile.c-red { --frame: #d7263d; background: #ffe1e4; }
.tile.c-gold { --frame: #c99700; background: linear-gradient(160deg, #fff4b8, #f3c93f); }
.tile.c-blue { --frame: #1f63d8; background: linear-gradient(160deg, #e1eeff, #9fc4fb); }
.tile.c-rainbow {
  background: linear-gradient(180deg, #ffd3d3, #fff0b0 28%, #d2f5d2 52%, #d3e6ff 76%, #ead6ff);
}
/* 虹の枠は重ねて描く（枠のぶん絵柄が小さくならないように、他の特殊な5と同じ大きさ） */
.tile.c-rainbow::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  padding: calc(var(--w) * .09);
  background: conic-gradient(from 0deg, #e63946, #f4a261, #e9c46a, #2a9d8f, #3a86ff, #8338ec, #e63946);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
.tile.c-red::after, .tile.c-gold::after, .tile.c-blue::after, .tile.c-rainbow::after { display: none; }

/* 牌譜 */
#replay { position: fixed; left: 0; right: 0; top: 0; height: var(--appH, 100%); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; background: rgba(0,0,0,.7); z-index: 40; display: flex; justify-content: center; align-items: flex-start; overflow: auto; padding: 10px; }
#replay.hidden { display: none; }
.rp-panel { width: min(640px, 100%); background: #102f25; border: 1px solid #2e7059; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.rp-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rp-top b { flex: 1; }
.rp-sel { font-size: 14px; padding: 4px; width: auto; }
.rp-info { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.rp-ev { font-weight: 800; color: var(--accent); font-size: 15px; }
.rp-dora { display: flex; gap: 2px; align-items: center; color: var(--muted); }
.rp-dora .tile { --w: 18px; }
.rp-player { border-top: 1px solid rgba(255,255,255,.08); padding-top: 6px; display: flex; flex-direction: column; gap: 4px; }
.rp-player.turn { background: rgba(255, 210, 90, .07); border-radius: 8px; }
.rp-head { display: flex; gap: 10px; align-items: baseline; font-size: 13px; flex-wrap: wrap; }
.rp-hand { display: flex; flex-wrap: wrap; gap: 1px; align-items: flex-end; }
.rp-hand .tile { --w: 22px; }
.rp-hand .tile.drawn { margin-left: 6px; }
.rp-hand .meld { margin-left: 6px; display: flex; align-items: flex-end; }
.rp-hand .meld .tile { --w: 18px; }
.rp-pond { display: flex; flex-wrap: wrap; gap: 1px; min-height: 10px; background: rgba(0,0,0,.2); border-radius: 4px; padding: 2px; }
.rp-pond .tile { --w: 17px; }
.rp-pond .tile.called { opacity: .35; }
.rp-res { background: rgba(0,0,0,.25); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.rp-win { font-weight: 800; }
.rp-ctl { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.rp-slider { width: 100%; }
.rp-pos { text-align: center; }
.fileOpen { display: block; text-align: center; color: var(--accent); cursor: pointer; font-size: 13px; margin-top: 8px; text-decoration: underline; }

/* 大きな和了のエフェクト */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 60; display: none; }
#fx.on { display: block; }
#fx canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#fx .fx-flash { position: absolute; inset: 0; background: #eef3ff; opacity: 0; transition: opacity .12s; }
#fx .fx-text { position: absolute; left: 0; right: 0; top: 34%; text-align: center; font-weight: 900; color: #ffe27a;
  text-shadow: 0 0 12px #ff9b2e, 0 0 30px #ff5b2e, 0 3px 0 #7a3000; animation: fxPop .7s cubic-bezier(.2,1.6,.4,1) both; }
#fx .fx-sub { font-size: 22px; letter-spacing: .2em; }
#fx .fx-big { font-size: min(46px, 11vw); }
#fx.tier2 .fx-big { font-size: min(60px, 13vw); color: #fff; text-shadow: 0 0 14px #7fb2ff, 0 0 40px #3d6bff, 0 4px 0 #1b2a7a; }
#fx.tier3 .fx-big { font-size: min(76px, 15vw); color: #fff; animation: fxPop .7s cubic-bezier(.2,1.6,.4,1) both, fxRainbow 1.2s linear infinite; }
#fx.tier3 .fx-sub { font-size: 28px; color: #fff; }
@keyframes fxPop { from { transform: scale(.2) rotate(-8deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes fxRainbow { 0% { text-shadow: 0 0 20px #ff4d4d, 0 0 50px #ff4d4d; } 25% { text-shadow: 0 0 20px #ffd84d, 0 0 50px #ffd84d; }
  50% { text-shadow: 0 0 20px #4dff88, 0 0 50px #4dff88; } 75% { text-shadow: 0 0 20px #4db8ff, 0 0 50px #4db8ff; } 100% { text-shadow: 0 0 20px #ff4d4d, 0 0 50px #ff4d4d; } }
body.fx-shake1 #table { animation: fxShake .35s 2; }
body.fx-shake2 #table { animation: fxShake .3s 5; }
body.fx-shake3 #table, body.fx-shake3 #modal { animation: fxShakeBig .25s 12; }
@keyframes fxShake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-4px,2px); } 50% { transform: translate(4px,-2px); } 75% { transform: translate(-2px,-3px); } }
@keyframes fxShakeBig { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-10px,5px); } 40% { transform: translate(9px,-6px); } 60% { transform: translate(-7px,-4px); } 80% { transform: translate(6px,7px); } }
@media (prefers-reduced-motion: reduce) { body[class*="fx-shake"] #table, body[class*="fx-shake"] #modal { animation: none; } }

/* ぽっち：色つきの光る枠＋星（白=金、發=緑、中=赤）で派手に */
.tile.pocchi { --pc: #e0245e; box-shadow: inset 0 0 0 calc(var(--w) * .09) var(--pc), 0 0 calc(var(--w) * .25) var(--pc), 0 calc(var(--w) * .07) 0 var(--tile-side); filter: drop-shadow(0 0 calc(var(--w) * .1) var(--pc)); } /* 点滅なし（光り続ける） */
.tile.pocchi.p-bai { --pc: #58b4ff; background: linear-gradient(160deg, #ffffff, #e3f3ff); }
.tile.pocchi.p-hatsu { --pc: #d4a106; background: linear-gradient(160deg, #fffbe6, #ffe07a); }
.tile.pocchi.p-chun { --pc: #d4a106; background: linear-gradient(160deg, #fffbe6, #ffe07a); }
@keyframes pocchiGlow { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.15) drop-shadow(0 0 calc(var(--w) * .18) var(--pc)); } }

/* 切る牌の選択（ダブルタップで切る） */

#btnReady { width: 100%; margin-top: 6px; }
button:disabled { opacity: .5; cursor: default; filter: none; }

/* 横向き：操作ボタンと待ち表示を盤の上に重ね、河の牌を大きく */
body.landscape #actions { position: fixed; right: 12px; bottom: calc(var(--hw) * 1.45 + 22px + env(safe-area-inset-bottom)); z-index: 8; min-height: 0; justify-content: flex-end; max-width: 45%; }
body.landscape #status { position: fixed; left: 12px; bottom: calc(var(--hw) * 1.45 + 26px + env(safe-area-inset-bottom)); z-index: 8; }
body.landscape #me { gap: 0; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 7;
  background: linear-gradient(180deg, rgba(8,28,22,.75), rgba(6,20,16,.95)); border-top: 1px solid rgba(255,255,255,.12); }

#waitBanner { position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 30; background: rgba(0,0,0,.8); color: #ffd873; padding: 8px 14px; border-radius: 10px; font-size: 14px; font-weight: 700; white-space: pre-line; text-align: center; pointer-events: none; }
#lineBar { position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 50; background: #06c755; border-radius: 22px; padding: 6px 6px 6px 16px; display: flex; gap: 6px; align-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.4); }

#lineBar button { color: #fff; text-decoration: none; padding: 4px 10px; }
/* 対局中は手牌の邪魔にならないよう左上に小さく */
body.inGame #lineBar { left: 8px; top: calc(6px + env(safe-area-inset-top)); bottom: auto; transform: none; padding: 3px 3px 3px 10px; }
body.inGame #lineBar a { font-size: 12px; }

/* ================= 動き（アニメーション） ================= */
/* 切った牌：手元から河へすべり込む */
.pond .tile.enter { animation: tileIn .28s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes tileIn { from { transform: translateY(70px) scale(1.5); opacity: 0; } 60% { opacity: 1; } to { transform: none; } }
.pond .tile.side.enter { animation: tileInSide .28s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes tileInSide { from { transform: translateY(70px) rotate(90deg) scale(1.5); opacity: 0; } to { transform: rotate(90deg); } }
/* ツモった牌：上から落ちてくる */
#hand .tile.drawIn { animation: drawIn .3s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes drawIn { from { transform: translateY(-40px) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
/* 鳴いた面子：ぽんと出てくる */

@keyframes meldIn { from { transform: scale(.3) translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
/* リーチ棒：上から置かれる */
.rstick.enter { animation: stickIn .5s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes stickIn { from { transform: translateY(-60px) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }
/* ポン・チー・カン・リーチ・ロン・ツモの文字 */
.claimFlash span { display: inline-block; padding: 6px 26px 10px; border-radius: 999px; font-size: 44px; font-weight: 900; letter-spacing: .08em; color: #fff;
  background: radial-gradient(circle at 50% 30%, var(--c1), var(--c2)); box-shadow: 0 0 0 4px rgba(255,255,255,.85), 0 0 40px var(--c2), 0 8px 18px rgba(0,0,0,.5);
  text-shadow: 0 3px 0 rgba(0,0,0,.35); animation: callPop 1s cubic-bezier(.2,1.6,.4,1) both; }
.claimFlash.cf-pon { --c1: #6fb6ff; --c2: #1d5fd1; }
.claimFlash.cf-chi { --c1: #7be08f; --c2: #1d8f45; }
.claimFlash.cf-kan { --c1: #c89bff; --c2: #6a2bc7; }
.claimFlash.cf-riichi { --c1: #ffd36a; --c2: #e07b00; }
.claimFlash.cf-win span { font-size: 64px; --c1: #ff8a7a; --c2: #d4142a; animation: callPop 1.3s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes callPop { 0% { transform: scale(.2) rotate(-10deg); opacity: 0; } 25% { transform: scale(1.15) rotate(2deg); opacity: 1; } 40% { transform: scale(1); } 80% { opacity: 1; } 100% { transform: scale(1.05); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pond .tile.enter, #hand .tile.drawIn, .meld.enter, .rstick.enter, .claimFlash span { animation-duration: .01s; } }

/* ================= ボタン・画面（ゲームっぽく） ================= */
button { border-radius: 12px; box-shadow: 0 4px 0 rgba(0,0,0,.35); transition: transform .06s, box-shadow .06s, filter .1s;
  background: linear-gradient(180deg, #3aa27a, #227556); }
button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
button.primary { background: linear-gradient(180deg, #ffe38a, #f2b51f); color: #4a3200; box-shadow: 0 4px 0 #a8740b, 0 0 18px rgba(255,200,60,.35); text-shadow: 0 1px 0 rgba(255,255,255,.5); }
button.primary:active { box-shadow: 0 1px 0 #a8740b; }
button.ghost { background: transparent; box-shadow: none; }
button.small { box-shadow: 0 3px 0 rgba(0,0,0,.35); }
/* 対局中のボタン：種類ごとに色分けした大きなボタン */
#actions button { border-radius: 16px; font-weight: 900; font-size: 18px; min-width: 84px; padding: 10px 18px; color: #fff; letter-spacing: .05em;
  text-shadow: 0 2px 0 rgba(0,0,0,.3); border: 2px solid rgba(255,255,255,.55); }
#actions button { background: linear-gradient(180deg, #f7f7f7, #d8d8d8); color: #222; text-shadow: none; box-shadow: 0 4px 0 #8c8c8c; }
#actions button.pon { background: linear-gradient(180deg, #5aa8ff, #1d5fd1); color: #fff; box-shadow: 0 4px 0 #123d88, 0 0 16px rgba(60,140,255,.45); }
#actions button.chi { background: linear-gradient(180deg, #5ed67a, #1d8f45); color: #fff; box-shadow: 0 4px 0 #115a2b, 0 0 16px rgba(60,200,110,.45); }
#actions button.kan { background: linear-gradient(180deg, #b98aff, #6a2bc7); color: #fff; box-shadow: 0 4px 0 #43187f, 0 0 16px rgba(160,100,255,.45); }
#actions button.riichi { background: linear-gradient(180deg, #ffd766, #f08c00); color: #4a2600; text-shadow: 0 1px 0 rgba(255,255,255,.5); box-shadow: 0 4px 0 #9a5700, 0 0 16px rgba(255,170,40,.5); }
#actions button.win { background: linear-gradient(180deg, #ff6b5c, #d4142a); color: #fff; box-shadow: 0 4px 0 #7d0a17, 0 0 22px rgba(255,60,60,.7); animation: winPulse 1s ease-in-out infinite; font-size: 20px; }
#actions button.pass { background: linear-gradient(180deg, #56645e, #33403a); color: #eee; box-shadow: 0 4px 0 #1a221e; border-color: rgba(255,255,255,.25); }
#actions button:active { transform: translateY(3px); }
@keyframes winPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
/* ロビー・待合室 */
h1 { font-size: 40px; font-weight: 900; letter-spacing: .15em; background: linear-gradient(180deg, #fff6c8 10%, #ffd24a 50%, #c98a00 90%);
  -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 rgba(0,0,0,.45)) drop-shadow(0 0 14px rgba(255,200,60,.35)); }
.card { background: linear-gradient(180deg, rgba(10,40,30,.85), rgba(4,22,16,.9)); border: 1px solid rgba(255,210,90,.35);
  box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08); }
.code { text-shadow: 0 3px 0 rgba(0,0,0,.4), 0 0 18px rgba(255,200,60,.4); }
#seats li { background: linear-gradient(90deg, rgba(255,255,255,.09), rgba(255,255,255,.03)); border: 1px solid rgba(255,255,255,.07); }
/* 結果画面 */
#modalBody { border: 2px solid rgba(255,210,90,.55); box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 20px 60px rgba(0,0,0,.6), 0 0 30px rgba(255,200,60,.15);
  background: linear-gradient(180deg, #143a2d, #0b261d); animation: modalIn .35s cubic-bezier(.2,1.3,.4,1) both; }
@keyframes modalIn { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
#modalBody .win h2, #modalBody > h2 { background: linear-gradient(90deg, transparent, rgba(212,20,42,.85) 20%, rgba(212,20,42,.85) 80%, transparent); padding: 6px 10px; border-radius: 6px; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
#modalBody .total { color: #fff; text-shadow: 0 0 12px rgba(255,210,90,.5); }
/* 横・向かいの人の文字も読める向きに */
.side[data-rel="1"] .claimFlash { transform: rotate(90deg); }
.side[data-rel="2"] .claimFlash { transform: rotate(180deg); }
.side[data-rel="3"] .claimFlash { transform: rotate(-90deg); }
.divider span { background: #08261c; border-radius: 6px; }

/* 結果画面のOKなどは、スクロールしても下に見えたまま */
#modalBody .sticky { position: sticky; bottom: -18px; z-index: 2; margin-bottom: -6px; }
#modalBody .row.sticky { background: linear-gradient(180deg, rgba(11,38,29,0), #0b261d 30%); padding: 10px 0 12px; }
#modalBody button.sticky { box-shadow: 0 4px 0 #a8740b, 0 -12px 18px #0b261d; }
/* 設定は歯車ボタンで開く */
#opts { display: none; background: rgba(0,0,0,.82); padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15); z-index: 20; font-size: 14px; gap: 8px; top: 44px; right: 8px; bottom: auto; }
#opts.open { display: flex; }
#opts label { color: #eee; }
#optsBtn { position: absolute; top: calc(6px + env(safe-area-inset-top)); right: 8px; z-index: 21; padding: 5px 12px; font-size: 13px; background: linear-gradient(180deg, #3b4a44, #25302b); }
body.landscape #opts { top: 44px; right: 8px; bottom: auto; }
body.landscape #optsBtn { position: fixed; }
#landHint { position: fixed; left: 50%; top: calc(46px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 40; background: rgba(0,0,0,.85); color: #ffd873; border-radius: 12px; padding: 8px 6px 8px 14px; display: flex; gap: 4px; align-items: center; font-size: 13px; font-weight: 700; width: max-content; max-width: 92vw; }
.lastHand summary { cursor: pointer; color: var(--accent); padding: 4px 0; }

/* 裏ドラをめくる演出 */
.doras .flip { display: inline-block; perspective: 260px; }
.doras .flip .inner { position: relative; display: inline-block; transform-style: preserve-3d; transform: rotateY(180deg); animation: uraFlip .6s cubic-bezier(.3,1.4,.5,1) both; }
.doras .flip .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.doras .flip .backside { position: absolute; left: 0; top: 0; transform: rotateY(180deg); }
@keyframes uraFlip { 0% { transform: rotateY(180deg) translateY(0); } 45% { transform: rotateY(90deg) translateY(-8px) scale(1.25); } 100% { transform: rotateY(0) translateY(0) scale(1); } }
#modalBody .reveal { opacity: 0; animation: revealIn .45s ease-out both; }
@keyframes revealIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .doras .flip .inner, #modalBody .reveal { animation-duration: .01s; animation-delay: 0s !important; } }

/* ---- 和了演出（王牌の台・裏ドラ引き出し・役の流れ込み・跳満スタンプ） ---- */
#modalBody .skip { align-self: flex-end; margin: -8px 0 -6px; overflow: hidden; background: linear-gradient(#3fbf4f, #1f8a2e); color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 4px 14px; font-weight: 800; animation: skipHide 0s linear forwards; }
@keyframes skipHide { to { visibility: hidden; opacity: 0; height: 0; padding: 0; margin: 0; border-width: 0; font-size: 0; } }
.stage { position: relative; height: 140px; margin: 2px -8px 0; border-radius: 10px; overflow: hidden; perspective: 380px; perspective-origin: 50% 0%;
  background: radial-gradient(120% 90% at 50% 10%, #2a6bb0 0%, #164a86 55%, #0c2f5c 100%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), inset 0 -20px 30px rgba(0,0,0,.35); }
.stage .plane { position: absolute; left: 50%; top: 8px; display: flex; gap: 1px; transform: translateX(-50%) rotateX(50deg); transform-origin: 50% 0; transform-style: preserve-3d; }
.stage .stk { position: relative; transform-style: preserve-3d; }
.stage .tile { --w: 30px; }
.stage .stk > .tile.hi { position: relative; transform: translateZ(3px); }
.stage .stk > .side { position: absolute; left: 0; right: 0; top: calc(30px * 1.36 - 3px); height: 16px; border-radius: 0 0 4px 4px;
  background: linear-gradient(#f6f1e1 0 26%, #f0a543 26% 50%, #f6f1e1 50% 76%, #d98a2c 76%); box-shadow: 0 3px 4px rgba(0,0,0,.4); }
.stage .ura { position: absolute; left: 0; top: 0; transform-style: preserve-3d; transform: translateY(calc(30px * 1.36 + 26px)); }
.stage .ura .inner { position: relative; transform-style: preserve-3d; }
.stage .ura .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.stage .ura .backside { position: absolute; left: 0; top: 0; transform: rotateX(180deg); }
.stage .ura.go { animation: uraPull .45s cubic-bezier(.2,.8,.3,1) both; }
.stage .ura.go .inner { animation: uraTurn .5s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes uraPull { 0% { transform: translateY(4px) translateZ(-1px); } 100% { transform: translateY(calc(30px * 1.36 + 26px)); } }
@keyframes uraTurn { 0% { transform: rotateX(180deg); } 50% { transform: rotateX(90deg) translateZ(14px) scale(1.15); } 100% { transform: rotateX(0); } }
.stage .stageLbl { position: absolute; right: 8px; bottom: 5px; font-size: 11px; color: rgba(255,255,255,.75); }
/* 裏ドラが乗った手牌の牌が光る */
.wtiles .tile.hit { animation: hitGlow 1.2s ease-out both; }
.wtiles .tile.hitDone, .wtiles .tile.hit { box-shadow: 0 0 0 2px #7fe0ff, 0 0 14px 4px rgba(120,220,255,.85), inset 0 calc(var(--w) * -.06) 0 var(--tile-edge); }
@keyframes hitGlow { 0% { box-shadow: inset 0 calc(var(--w) * -.06) 0 var(--tile-edge); transform: none; } 25% { box-shadow: 0 0 0 3px #fff, 0 0 26px 10px rgba(160,235,255,1); transform: translateY(-4px) scale(1.12); } 100% { transform: none; } }
/* 役が1行ずつ右から流れ込む */
#modalBody .slideIn { opacity: 0; animation: yakuIn .38s cubic-bezier(.2,.9,.3,1) both; }
@keyframes yakuIn { 0% { opacity: 0; transform: translateX(40px); filter: brightness(2.2); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; filter: none; } }
.yakulist .yk, .yakulist .yv { border-bottom: 1px solid rgba(255,255,255,.08); padding: 1px 0; }
/* 満貫・跳満などのスタンプ */
#modalBody .stamp { text-align: center; font-size: 46px; font-weight: 900; line-height: 1.05; letter-spacing: .06em; font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  background: linear-gradient(180deg, #fffbe0 0%, #ffd54a 45%, #c98a12 55%, #ffe58a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-text-stroke: 1px rgba(90,50,0,.6); filter: drop-shadow(0 0 10px rgba(255,200,60,.55)) drop-shadow(0 3px 0 rgba(0,0,0,.45)); }
#modalBody .stamp.ym { background-image: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bff95, #6bd5ff, #c86bff); -webkit-text-stroke: 1px rgba(0,0,0,.45); }
#modalBody .stampIn { opacity: 0; animation: stampIn .5s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes stampIn { 0% { opacity: 0; transform: scale(2.6) rotate(-6deg); } 60% { opacity: 1; transform: scale(.92) rotate(1deg); } 100% { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .stage .ura.go, .stage .ura.go .inner, #modalBody .slideIn, #modalBody .stampIn, .wtiles .tile.hit { animation-duration: .01s; animation-delay: 0s !important; } }
body.landscape .stage { height: 100px; }
body.landscape .stage .plane { top: 4px; }
body.landscape .stage .ura { transform: translateY(calc(30px * 1.36 + 14px)); }
@media (orientation: landscape) and (max-height: 500px) { .stage .ura.go { animation-name: uraPullL; } }
@keyframes uraPullL { 0% { transform: translateY(4px) translateZ(-1px); } 100% { transform: translateY(calc(30px * 1.36 + 14px)); } }

.side[data-rel="2"] .openWaits { transform: rotate(180deg); }

#modalBody.land2 .sticky { position: static; margin: 0; }
#modalBody.land2 .skip { position: absolute; right: 18px; top: 8px; margin: 0; z-index: 3; }

#modalBody.land2 { position: relative; }

#modalBody.land2 .finale { flex-wrap: wrap; justify-content: center; row-gap: 0; }
#modalBody.land2 .rcol { padding-top: 26px; }
/* 祝儀の枚数を大きく */
#modalBody .finChips { display: flex; align-items: baseline; justify-content: center; gap: 10px; flex-wrap: wrap; }

        if (tried.get(k)) riichiTiles.push(t);
      }
      if (riichiTiles.length) a.riichi = riichiTiles;
    }
    // 槓（1局4回まで）
    if (hasDraw && this.live.length > 0 && this.kanCount < 4) {
      const c = Y.toCounts(this.closedKinds(seat));
      const ankan = [];
      for (let k = 0; k < 34; k++) if (c[k] === 4) {
        if (r.state) {
          if (kindOf(this.drawn) !== k) continue;
          const before = this.closedKinds(seat); before.splice(before.indexOf(kindOf(this.drawn)), 1);
          const w1 = this.waitsOf(seat, before);
          const after = this.closedKinds(seat).filter(x => x !== k);
          const w2 = Y.getWaits(after, this.melds[seat].length + 1);
          if (w1.join() !== w2.join()) continue;
        }
        ankan.push(k);
      }
      if (ankan.length) a.ankan = ankan;
      if (!r.state) {
        const kakan = this.melds[seat].filter(m => m.type === 'pon' && c[kindOf(m.tiles[0])] > 0).map(m => kindOf(m.tiles[0]));
        if (kakan.length) a.kakan = kakan;
      }
    }
    return a;
  }

  // ============ 行動の実行 ============
  act(seat, action) {
    try {
      const prevPhase = this.phase, prevHandNo = this.handNo, prevResult = this.result;
      const prevMelds = this.melds.map(m => m.length);
      const ok = this._act(seat, action);
      if (ok !== false && action && prevHandNo === this.handNo) this.recordAct(seat, action, prevPhase, prevResult, prevMelds);
      if (ok !== false) this.onUpdate();
      return ok !== false;
    } catch (e) {
      console.error(e);
      return false;
    }
  }

  _act(seat, action) {
    // 鳴きなしの設定（いつでも切り替えられる。鳴きなしの人にはポン・チー・カンの選択肢を出さず、待たせない）
    if (action && action.type === 'noCall') {
      this.noCall[seat] = !!action.on;
      if (this.noCall[seat] && this.phase === 'claim' && this.claim && this.claim.options[seat] && !this.claim.options[seat].ron && !(seat in this.claim.responses)) {
        this.claim.responses[seat] = { type: 'pass' }; this.tryResolveClaim();
      }
      return true;
    }
    const avail = this.actionsFor(seat);
    if (!avail || !action) return false;
    const t = action.type;
    if (this.phase === 'result') {
      if (t === 'dealer' && avail.dealerChoice) { this.dealerDecide(!!action.cont); this.ready.add(seat); this.tryNextHand(); return true; }
      if (t !== 'ready' || !avail.ready) return false;
      this.ready.add(seat);
      this.tryNextHand();
      return true;
    }
    if (this.phase === 'choose') {
      if (t !== 'choose') return false;
      const i = action.index == null ? this.choose.defaultIndex : action.index;
      if (!(i >= 0 && i < this.choose.cands.length)) return false;
      this.finishChoose(i);
      return true;
    }
    if (this.phase === 'discard') {
      if (t === 'discard' || t === 'riichi') {
        const tile = action.tile;
        const list = t === 'riichi' ? avail.riichi : avail.discard;
        if (!list || !list.includes(tile)) return false;
        return this.doDiscard(seat, tile, t === 'riichi', !!action.open);
      }
      if (t === 'tsumo' && avail.tsumo) return this.doTsumo(seat, avail.wild || null);
      if (t === 'ankan' && avail.ankan && avail.ankan.includes(action.kind)) return this.doAnkan(seat, action.kind);
      if (t === 'kakan' && avail.kakan && avail.kakan.includes(action.kind)) return this.doKakan(seat, action.kind);
      return false;
    }
    if (this.phase === 'claim') {
      if (t === 'pass') { this.claim.responses[seat] = { type: 'pass' }; }
      else if (t === 'ron' && avail.ron) this.claim.responses[seat] = { type: 'ron' };
      else if (t === 'pon' && avail.pon && avail.pon.some(o => o.join() === (action.tiles || []).join())) this.claim.responses[seat] = { type: 'pon', tiles: action.tiles };
      else if (t === 'minkan' && avail.minkan) this.claim.responses[seat] = { type: 'minkan' };
      else if (t === 'chi' && avail.chi && avail.chi.some(o => o.join() === (action.tiles || []).join())) this.claim.responses[seat] = { type: 'chi', tiles: action.tiles };
      else return false;
      this.tryResolveClaim();
      return true;
    }
    return false;
  }

  doDiscard(seat, tile, riichi, open) {
    const hand = this.hands[seat];
    const r = this.riichi[seat];
    // オープンリーチの当たり牌を捨てるしかなかった（R-32：役満払い）
    const forced = !r.state && this.forbiddenKinds(seat).has(kindOf(tile));
    hand.splice(hand.indexOf(tile), 1);
    const tsumogiri = tile === this.drawn;
    this.drawn = null;
    this.kuikae = null;
    if (r.state) r.ippatsu = false;
    if (riichi) {
      r.pending = true;
      r.pendingOpen = !!open;
      r.pendingDouble = !this.anyCall && !this.hasDiscarded[seat];
    }
    this.hasDiscarded[seat] = true;
    this.discards[seat].push({ tile, riichi, open: !!(riichi && open), tsumogiri, called: false, forced });
    this.discardKinds[seat].add(kindOf(tile));
    this.lastDiscard = { seat, tile };
    this.rinshanFlag = false;
    this.openClaim(seat, tile, false, forced);
    return true;
  }

  openClaim(from, tile, isChankan, forced) {
    const k = kindOf(tile);
    const options = {};
    for (let s = 0; s < 4; s++) {
      if (s === from) continue;
      const o = {};
      if (isChankan === 'ankan') {
        if (!this.isFuriten(s) && this.kokushiWith(s, k)) o.ron = true;
      } else if (!this.isFuriten(s) && this.waitsOf(s).includes(k)) {
        if (this.canWinNormal(s, tile, false, { chankan: isChankan })) o.ron = true;
      }
      if (!isChankan && !this.riichi[s].state && !(this.noCall && this.noCall[s]) && this.live.length > 0) {
        const same = this.hands[s].filter(t => kindOf(t) === k);
        // 見た目が同じ牌（色なしの同じ種類）は1つの選択肢にまとめる。特殊な5・ぽっちは別の選択肢
        const vk = (t) => R.fiveColor(t) || this.pocchiOf(t) || 'n';
        if (same.length >= 2) {
          const variants = new Map();
          for (let i = 0; i < same.length; i++) for (let j = i + 1; j < same.length; j++) {
            const pair = [same[i], same[j]];
            const key = pair.map(vk).sort().join();
            if (!variants.has(key)) variants.set(key, pair);
          }
          const pon = [...variants.values()].filter(p => this.canDiscardAfterCall(s, p, [k]));
          if (pon.length) o.pon = pon;
        }
        if (same.length >= 3 && this.kanCount < 4) o.minkan = true;
        if (s === (from + 1) % 4 && k < 27) {
          const chi = [];
          const n = k % 9;
          const pats = [];
          if (n >= 2) pats.push([k - 2, k - 1]);
          if (n >= 1 && n <= 7) pats.push([k - 1, k + 1]);
          if (n <= 6) pats.push([k + 1, k + 2]);
          for (const [a, b] of pats) {
            const ta = this.hands[s].filter(t => kindOf(t) === a);
            const tb = this.hands[s].filter(t => kindOf(t) === b);
            if (!ta.length || !tb.length) continue;
            const seen = new Set();
            for (const x of ta) for (const y of tb) {
              const key = vk(x) + ',' + vk(y);
              if (seen.has(key)) continue;
              seen.add(key);
              const forbid = [k];
              const lo = Math.min(a, b, k);
              if (k === lo && (k % 9) <= 5) forbid.push(k + 3);
              if (k === lo + 2 && (lo % 9) >= 1) forbid.push(lo - 1);
              if (this.canDiscardAfterCall(s, [x, y], forbid)) chi.push([x, y]);
            }
          }
          if (chi.length) o.chi = chi;
        }
      }
      if (!o.ron && isChankan !== 'ankan' && this.waitsOf(s).includes(k)) {
        this.furitenTemp[s] = true;
        if (this.riichi[s].state) this.furitenRiichi[s] = true;
      }
      if (Object.keys(o).length) { o.pass = true; options[s] = o; }
    }
    this.claim = { from, tile, isChankan, forced: !!forced, options, responses: {} };
    this.phase = 'claim';
    this.tryResolveClaim();
  }

  canDiscardAfterCall(seat, used, forbidKinds) {
    const rest = this.hands[seat].filter(t => !used.includes(t));
    return rest.some(t => !forbidKinds.includes(kindOf(t)));
  }

  tryResolveClaim() {
    const c = this.claim;
    const seats = Object.keys(c.options).map(Number);
    // 誰かがロンしたら、ロンできない人（ポン・チーだけの人）の返事は待たない
    if (seats.some(s => c.responses[s] && c.responses[s].type === 'ron')) {
      for (const s of seats) if (!(s in c.responses) && !c.options[s].ron) c.responses[s] = { type: 'pass' };
    }
    if (!seats.every(s => s in c.responses)) return;
    for (const s of seats) {
      if (c.options[s].ron && c.responses[s].type !== 'ron') {
        this.furitenTemp[s] = true;
        if (this.riichi[s].state) this.furitenRiichi[s] = true;
      }
    }
    const order = [1, 2, 3].map(d => (c.from + d) % 4);
    const rons = order.filter(s => c.responses[s] && c.responses[s].type === 'ron');
    if (rons.length) {
      // 槍槓：加槓した牌はロンした人のもの。加槓はなかったことにしてポンに戻す（結果画面で牌が二重に見えないように）
      if (c.isChankan === true) {
        const m = this.melds[c.from].find(x => x.type === 'kakan' && x.added === c.tile);
        if (m) { m.type = 'pon'; m.tiles = m.tiles.filter(t => t !== c.tile); delete m.added; }
      }
      this.doRon(rons, c.from, c.tile, c.isChankan, c.forced); return;
    }
    if (c.isChankan === 'ankan') { this.claim = null; this.hands[c.from].push(c.tile); this.completeAnkan(c.from, kindOf(c.tile)); return; }
    if (c.isChankan) { this.claim = null; this.finishKakan(c.from); return; }
    const pk = order.find(s => c.responses[s] && (c.responses[s].type === 'pon' || c.responses[s].type === 'minkan'));
    this.establishRiichi(c.from);
    if (pk !== undefined) {
      const resp = c.responses[pk];
      if (resp.type === 'pon') this.doPon(pk, c.from, c.tile, resp.tiles);
      else this.doMinkan(pk, c.from, c.tile);
      return;
    }
    const chiSeat = order.find(s => c.responses[s] && c.responses[s].type === 'chi');
    if (chiSeat !== undefined) { this.doChi(chiSeat, c.from, c.tile, c.responses[chiSeat].tiles); return; }
    this.claim = null;
    this.afterDiscardPass(c.from);
  }

  establishRiichi(seat) {
    const r = this.riichi[seat];
    if (!r.pending) return;
    r.pending = false;
    r.state = r.pendingDouble ? 2 : 1;
    r.open = !!r.pendingOpen;
    r.ippatsu = true;
    this.scores[seat] -= 1000;
    this.kyotaku++;
    if (r.open) { this.chips[seat] -= 2; this.kyotakuChips += 2; }
  }

  afterDiscardPass(from) {
    if (this.live.length === 0) return this.exhaustiveDraw();
    this.drawTile((from + 1) % 4, false);
  }

  breakIppatsu() { for (const r of this.riichi) r.ippatsu = false; this.anyCall = true; }
  markCalled(from) { const d = this.discards[from]; d[d.length - 1].called = true; }

  // 包（大三元・大四喜）の判定
  checkPao(seat, from, k) {
    const kinds = this.melds[seat].filter(m => m.type !== 'chi').map(m => kindOf(m.tiles[0]));
    if (k >= 31 && kinds.filter(x => x >= 31).length === 3) this.pao[seat].dragon = from;
    if (k >= 27 && k <= 30 && kinds.filter(x => x >= 27 && x <= 30).length === 4) this.pao[seat].wind = from;
  }

  doPon(seat, from, tile, tiles) {
    this.claim = null;
    this.breakIppatsu();
    this.markCalled(from);
    for (const t of tiles) this.hands[seat].splice(this.hands[seat].indexOf(t), 1);
    this.melds[seat].push({ type: 'pon', tiles: [...tiles, tile], called: tile, from: (from - seat + 4) % 4 });
    this.checkPao(seat, from, kindOf(tile));
    this.kuikae = [kindOf(tile)];
    this.turn = seat; this.phase = 'discard'; this.drawn = null;
  }

  doChi(seat, from, tile, tiles) {
    this.claim = null;
    this.breakIppatsu();
    this.markCalled(from);
    for (const t of tiles) this.hands[seat].splice(this.hands[seat].indexOf(t), 1);
    const k = kindOf(tile);
    const lo = Math.min(k, ...tiles.map(kindOf));
    this.melds[seat].push({ type: 'chi', tiles: [tile, ...sortTiles(tiles)], called: tile, from: 3 });
    const forbid = [k];
    if (k === lo && (k % 9) <= 5) forbid.push(k + 3);
    if (k === lo + 2 && (lo % 9) >= 1) forbid.push(lo - 1);
    this.kuikae = forbid;
    this.turn = seat; this.phase = 'discard'; this.drawn = null;
  }

  doMinkan(seat, from, tile) {
    this.claim = null;
    this.breakIppatsu();
    this.markCalled(from);
    const k = kindOf(tile);
    const used = this.hands[seat].filter(t => kindOf(t) === k);
    this.hands[seat] = this.hands[seat].filter(t => kindOf(t) !== k);
    this.melds[seat].push({ type: 'minkan', tiles: [...used, tile], called: tile, from: (from - seat + 4) % 4 });
    this.checkPao(seat, from, k);
    this.addKan(seat);
    this.drawTile(seat, true);
  }

  // 国士無双の聴牌で、kを加えると国士無双になるか（暗槓の槍槓用）
  kokushiWith(seat, k) {
    if (this.melds[seat].length) return false;
    const ks = this.closedKinds(seat).concat([k]);
    const Yk = [0, 8, 9, 17, 18, 26, 27, 28, 29, 30, 31, 32, 33];
    return ks.length === 14 && ks.every(x => Yk.includes(x)) && Yk.every(x => ks.includes(x));
  }

  doAnkan(seat, k) {
    // 国士無双だけは暗槓でもロンできる（槍槓）
    const robbers = [0, 1, 2, 3].filter(s => s !== seat && !this.isFuriten(s) && this.kokushiWith(s, k));
    if (robbers.length) {
      const tile = this.hands[seat].filter(t => kindOf(t) === k).pop();
      this.hands[seat].splice(this.hands[seat].indexOf(tile), 1);
      this.drawn = null;
      this.openClaim(seat, tile, 'ankan', false);
      return true;
    }
    return this.completeAnkan(seat, k);
  }

  completeAnkan(seat, k) {
    this.breakIppatsu();
    const used = this.hands[seat].filter(t => kindOf(t) === k);
    this.hands[seat] = this.hands[seat].filter(t => kindOf(t) !== k);
    this.melds[seat].push({ type: 'ankan', tiles: used, from: 0 });
    this.addKan(seat);
    this.drawTile(seat, true);
    return true;
  }

  doKakan(seat, k) {
    const tile = this.hands[seat].find(t => kindOf(t) === k);
    this.hands[seat].splice(this.hands[seat].indexOf(tile), 1);
    const m = this.melds[seat].find(x => x.type === 'pon' && kindOf(x.tiles[0]) === k);
    m.type = 'kakan';
    m.tiles.push(tile);
    m.added = tile;
    this.drawn = null;
    this.openClaim(seat, tile, true, false);
    return true;
  }

  finishKakan(seat) {
    this.breakIppatsu();
    this.addKan(seat);
    this.drawTile(seat, true);
  }

  addKan() {
    this.kanCount++;
    this.doraCount = Math.min(5, 1 + this.kanCount);
    this.checkPocchiIndicator(this.dead[4 + this.doraCount - 1]);
  }

  // ============ 和了の評価（候補の列挙） ============
  /*
   winTile: 和了牌, isTsumo, opts: { wild: 'bai'|'hatsu'|'chun'|null, chankan, forced }
   戻り値: 候補の配列（役ありのものだけ）
  */
  winCandidates(seat, winTile, isTsumo, opts = {}) {
    const wild = opts.wild || null;
    const closedIds = isTsumo ? this.hands[seat].slice() : this.hands[seat].concat([winTile]);
    const meldIds = this.melds[seat].flatMap(m => m.tiles);
    const allIds = closedIds.concat(meldIds);
    const r = this.riichi[seat];
    const ctxBase = this.baseCtx(seat, isTsumo, { chankan: opts.chankan });
    const baseKinds = closedIds.filter(t => t !== (wild ? winTile : -1)).map(kindOf);
    const wildKinds = wild ? this.waitsOf(seat, baseKinds) : [null];

    // 変換できる5（赤・金・青）
    const convertible = allIds.filter(t => t !== (wild ? winTile : -1) && ['red', 'gold', 'blue'].includes(R.fiveColor(t)));
    const ownRainbow = new Set(allIds.filter(t => R.fiveColor(t) === 'rainbow').map(t => R.SUIT_OF_FIVE[kindOf(t)]));

    // 追加でめくる槓ドラ（オープンリーチ2組、中ぽっちで変える5がない1組）
    const extras = [];
    if (r.state > 0 && r.open) extras.push(this.takeExtraPair(), this.takeExtraPair());
    const nOpenExtra = extras.length;
    // 虹に変えられるのは手牌の赤・金・青の5だけで、その5と同じ種類の虹になる（すでにその虹を持っていたら不可）
    const chunConvert = wild === 'chun' && convertible.some(t => !ownRainbow.has(R.SUIT_OF_FIVE[kindOf(t)]));
    if (wild === 'chun' && !chunConvert) extras.push(this.takeExtraPair());
    // 追加でめくった表ドラ表示牌がぽっちなら、その種類も全部ぽっち（R-33。ふつうの表示牌と同じ扱い）
    for (const e of extras) this.checkPocchiIndicator(e.omote);
    let omote = this.omoteIndicators().concat(extras.map(e => e.omote));
    let ura = r.state > 0 ? this.uraIndicators().concat(extras.map(e => e.ura)) : [];
    const omoteAll = omote, uraAll = ura;
    // 中ぽっちを5として取ってその5を虹にした場合は、追加の槓ドラはめくらない（中ぽっちのぶんの1組を除いた表示牌）
    const omoteNoChun = this.omoteIndicators().concat(extras.slice(0, nOpenExtra).map(e => e.omote));
    const uraNoChun = r.state > 0 ? this.uraIndicators().concat(extras.slice(0, nOpenExtra).map(e => e.ura)) : [];

    // 変換の候補
    const convOpts = [];
    for (const t of convertible) { const s = R.SUIT_OF_FIVE[kindOf(t)]; if (!ownRainbow.has(s)) convOpts.push({ id: t, suit: s }); }


    const cands = [];
    const self = this;

    for (const wk of wildKinds) {
      // 中ぽっちを5として取るときは、その5（中ぽっち自身）も虹に変えられる（手牌の5を変えるのとどちらか、祝儀の多いほう）
      const wsuit = wk != null ? R.SUIT_OF_FIVE[wk] : null;
      const selfOpt = wild === 'chun' && wsuit && !ownRainbow.has(wsuit) ? { id: winTile, suit: wsuit, self: true } : null;
      omote = selfOpt && !chunConvert ? omoteNoChun : omoteAll; ura = selfOpt && !chunConvert ? uraNoChun : uraAll;
      const uraPocchi = ura.map(u => this.pocchiOf(u)); // 裏ドラ表示牌のぽっち（R-34）
      const closedKinds = wild ? baseKinds.concat([wk]) : closedIds.map(kindOf);
      const winKind = wild ? wk : kindOf(winTile);
      // 一番多い牌（暗槓含む）
      const cnt = Y.toCounts(closedKinds);
      for (const m of this.melds[seat]) if (m.type === 'ankan') cnt[kindOf(m.tiles[0])] += 4;
      const maxN = Math.max(...cnt);
      const mostKinds = []; for (let k = 0; k < 34; k++) if (cnt[k] === maxN && maxN > 0) mostKinds.push(k);

      // 裏ドラ表示牌ごとの選択肢
      const uraChoiceLists = ura.map((u, i) => {
        const pt = uraPocchi[i];
        if (pt === 'hatsu' || pt === 'chun') return mostKinds.map(k => ({ kind: k }));
        // 倍ぽっち：5を虹に変え、さらに一番多い牌を裏ドラに（変えられる5が残っていなければ裏ドラだけ）
        if (pt === 'bai') return convOpts.map(c => ({ conv: c })).concat([{ noConv: true }]).flatMap(c => mostKinds.map(k => ({ ...c, kind: k })));
        return [{ normal: true }];
      });
      // 中ぽっちを5として使ったときは、その中ぽっち自身を虹に変えることもできる
      const chunLists = wild === 'chun'
        ? (chunConvert || selfOpt ? convOpts.concat(selfOpt ? [selfOpt] : []).map(c => ({ conv: c })) : [{}])
        : [{}];

      // 直積
      const combos = [[]];
      const lists = [chunLists, ...uraChoiceLists];
      let prodCount = 1;
      for (const l of lists) prodCount *= Math.max(1, l.length);
      if (prodCount > 3000) { /* 念のための上限 */ lists.forEach((l, i) => { lists[i] = l.slice(0, 3); }); }
      let acc = [[]];
      for (const l of lists) {
        const next = [];
        for (const a of acc) for (const x of l) next.push(a.concat([x]));
        acc = next;
      }
      for (const combo of acc) {
        const chunChoice = combo[0];
        const uraChoices = combo.slice(1);
        const conversions = [];
        if (chunChoice.conv) conversions.push(chunChoice.conv);
        for (const u of uraChoices) if (u.conv) conversions.push(u.conv);
        // 変換の重複チェック（同じ牌・同じ虹は不可）
        if (new Set(conversions.map(c => c.id)).size !== conversions.length) continue;
        if (new Set(conversions.map(c => c.suit)).size !== conversions.length) continue;
        // 倍ぽっちで5を変えないのは、虹に変えられる5がもう残っていないときだけ
        if (uraChoices.some(u => u.noConv)) {
          const usedIds = new Set(conversions.map(c => c.id)), usedSuits = new Set(conversions.map(c => c.suit));
          if (convOpts.some(c => !usedIds.has(c.id) && !usedSuits.has(c.suit))) continue;
        }
        // 中ぽっち自身を虹にした場合は追加の槓ドラをめくらない
        const c = evalOne(wk, closedKinds, winKind, conversions, uraChoices);
        if (c) cands.push(c);
      }
    }

    function evalOne(wk, closedKinds, winKind, conversions, uraChoices) {
      const doraKinds = omote.map(t => Y.doraFromIndicator(kindOf(t)));
      const uraKinds = [];
      ura.forEach((u, i) => {
        const ch = uraChoices[i];
        if (ch.normal) uraKinds.push(Y.doraFromIndicator(kindOf(u)));
        else if (ch.kind != null) uraKinds.push(ch.kind);
      });
      const nonWild = allIds.filter(t => t !== (wild ? winTile : -1));
      const akaCount = nonWild.filter(t => R.fiveColor(t)).length + (conversions.some(c => c.self) ? 1 : 0); // 虹にした中ぽっちも特殊牌ドラ
      const ctx = Object.assign({}, ctxBase, { closedKinds, winKind, doraKinds, uraKinds, akaCount });
      const res = Y.evaluate(ctx);
      if (!res || !res.hasYaku) return null;

      // 特殊牌の祝儀の単位
      const units = [];
      const unitLabels = [];
      const convMap = new Map(conversions.map(c => [c.id, c.suit]));
      const sixIds = { m: [], p: [], s: [] };
      for (const t of allIds) {
        if (wild && t === winTile) {
          units.push('pocchi'); unitLabels.push(R.POCCHI_NAME[wild]);
          // 5として取った中ぽっちを虹にしたときは、中ぽっちと虹の両方を数える
          if (convMap.has(t)) { units.push('rainbow_' + convMap.get(t)); unitLabels.push(R.RAINBOW_NAME[convMap.get(t)] + '(中ぽっち)'); }
          continue;
        }
        if (convMap.has(t)) { units.push('rainbow_' + convMap.get(t)); unitLabels.push(R.RAINBOW_NAME[convMap.get(t)] + '(変換)'); continue; }
        const fc = R.fiveColor(t);
        if (fc === 'rainbow') { const s = R.SUIT_OF_FIVE[kindOf(t)]; units.push('rainbow_' + s); unitLabels.push(R.RAINBOW_NAME[s]); continue; }
        if (fc) { units.push(fc); unitLabels.push(R.COLOR_NAME[fc] + '5'); continue; }
        const pt = self.pocchiOf(t);
        if (pt) { units.push('pocchi'); unitLabels.push(R.POCCHI_NAME[pt]); continue; }
        const k = kindOf(t);
        for (const s of ['m', 'p', 's']) if (k === R.SIX_KIND[s]) sixIds[s].push(t);
      }
      // オールマイティを6として使ったときも、色の付いた6になる
      if (wild && wk != null) for (const s of ['m', 'p', 's']) if (wk === R.SIX_KIND[s]) sixIds[s].push(winTile);
      // ドラ表示牌が特殊な5のときの6（R-31）
      let uraSixHits = 0;
      const rainbowHave = new Set(units.filter(u => u.startsWith('rainbow_')).map(u => u.slice(8)));
      for (const s of ['m', 'p', 's']) {
        if (!sixIds[s].length) continue;
        const srcs = [];
        omote.forEach(t => { if (kindOf(t) === R.FIVE_KIND[s]) srcs.push({ color: R.fiveColor(t), ura: false }); });
        ura.forEach((t, i) => { if (uraChoices[i].normal && kindOf(t) === R.FIVE_KIND[s]) srcs.push({ color: R.fiveColor(t), ura: true }); });
        if (!srcs.length) continue;
        // 同じ6に色が重なったら両方数える（例：裏に赤5筒と青5筒 → 6筒1枚で赤＋青）
        const plain = srcs.filter(x => x.color !== 'rainbow');
        const hasRainbow = srcs.some(x => x.color === 'rainbow') && !rainbowHave.has(s);
        // 裏の虹5で虹の効果を持つのは1枚だけ（残りの6はただの裏ドラなので、裏ドラの祝儀が付く）
        const rainbowFromUra = hasRainbow && !srcs.some(x => x.color === 'rainbow' && !x.ura);
        sixIds[s].forEach((t, i) => {
          // 虹の効果を持った6は虹だけ（赤・金・青とは複合しない）
          if (i === 0 && hasRainbow) { units.push('rainbow_' + s); unitLabels.push(R.RAINBOW_NAME[s] + '(6)'); rainbowHave.add(s); return; }
          for (const p of plain) { units.push(p.color); unitLabels.push(R.COLOR_NAME[p.color] + '6'); }
        });
        // 裏ドラの祝儀を数えない6：裏の赤・金・青で色が付いた6は全部、裏の虹で効果を持った6は1枚だけ
        uraSixHits += sixIds[s].length * plain.filter(x => x.ura).length + (rainbowFromUra ? 1 : 0);
      }
      const uraChips = Math.max(0, (res.uraHan || 0) - uraSixHits);
      for (let i = 0; i < uraChips; i++) { units.push('ura'); unitLabels.push('裏ドラ'); }
      if (res.yaku.some(y => y[0] === '一発')) { units.push('ippatsu'); unitLabels.push('一発'); }

      const forced = !!opts.forced;
      const chips = R.totalChips({
        units, han: res.han, yakumanCount: res.yakumanCount, isTsumo, quads: res.quads,
        yakuNames: res.yaku.map(y => y[0]), menzen: res.menzen, baiTsumo: wild === 'bai', forceYakuman: forced,
      });
      let base = res.base, limit = res.limit;
      if (forced && base < 8000) { base = 8000; limit = '役満払い'; }
      const descParts = [];
      if (wild) descParts.push(`${R.POCCHI_NAME[wild]}を${tileName(wk)}として`);
      for (const c of conversions) descParts.push(c.self ? `その${tileName(wk)}→${R.RAINBOW_NAME[c.suit]}` : `${R.COLOR_NAME[R.fiveColor(c.id)]}${tileName(kindOf(c.id))}→${R.RAINBOW_NAME[c.suit]}`);
      uraChoices.forEach(u => { if (u.kind != null) descParts.push(`裏ドラ=${tileName(u.kind)}`); });
      return {
        ind: { omote, ura },
        desc: descParts.join('・'), han: res.han, fu: res.fu, yaku: res.yaku, limit, yakuman: res.yakumanCount,
        yakumanNames: res.yakumanNames, base, chips: chips.total, chipsDetail: chips, units: unitLabels,
        wildKind: wk, conversions, forced,
      };
    }

    this._lastIndicators = { omote: omoteAll, ura: uraAll, extras };
    return cands;
  }

  // 候補の既定：祝儀が多い→点数が高い
  static defaultIndex(cands) {
    let bi = 0;
    cands.forEach((c, i) => {
      const b = cands[bi];
      if (c.chips > b.chips || (c.chips === b.chips && c.base > b.base)) bi = i;
    });
    return bi;
  }

  // ============ 和了 ============
  doTsumo(seat, wild) {
    const cands = this.winCandidates(seat, this.drawn, true, { wild });
    if (!cands.length) return false;
    const info = { seat, from: null, tsumo: true, tile: this.drawn, wild, cands, indicators: this._lastIndicators };
    this.startChoose([info]);
    return true;
  }

  doRon(seats, from, tile, isChankan, forced) {
    this.claim = null;
    this.riichi[from].pending = false; // 宣言牌でロンされたらリーチ不成立
    const infos = seats.map(seat => {
      const f = forced && this.riichi[seat].state > 0 && this.riichi[seat].open;
      const cands = this.winCandidates(seat, tile, false, { chankan: isChankan, forced: f });
      return { seat, from, tsumo: false, tile, wild: null, cands, indicators: this._lastIndicators };
    });
    this.startChoose(infos);
  }

  // 候補が複数あるときは和了者が選ぶ（R-28・R-34）。ダブロン以上は自動
  startChoose(infos) {
    // 祝儀も点数も他の候補以下の取り方は選ぶ意味がないので外す（祝儀が一番多い取り方が点数も一番高ければ自動で決まる）
    for (const inf of infos) {
      const cs = inf.cands;
      const keep = cs.filter((c, i) => !cs.some((d, j) => j !== i && d.chips >= c.chips && d.base >= c.base && (d.chips > c.chips || d.base > c.base || j < i)));
      if (keep.length) inf.cands = keep;
    }
    if (infos.length === 1 && infos[0].cands.length > 1) {
      const c = infos[0];
      this.choose = { seat: c.seat, infos, cands: c.cands, defaultIndex: Game.defaultIndex(c.cands), deadline: Date.now() + CHOICE_SECONDS * 1000 };
      this.phase = 'choose';
      return;
    }
    for (const inf of infos) inf.chosen = inf.cands[Game.defaultIndex(inf.cands)];
    this.settleWins(infos);
  }

  finishChoose(i) {
    const infos = this.choose.infos;
    infos[0].chosen = this.choose.cands[i];
    this.choose = null;
    this.settleWins(infos);
  }

  settleWins(infos) {
    const delta = [0, 0, 0, 0];
    const chipDelta = [0, 0, 0, 0];
    const busters = {}; // 支払った人 → 最初の受け取り手
    const pay = (from, to, pts, chips) => {
      delta[from] -= pts; delta[to] += pts;
      chipDelta[from] -= chips; chipDelta[to] += chips;
      if (!(from in busters)) busters[from] = to;
    };
    const wins = [];
    let dealerWon = false;
    infos.forEach((inf, idx) => {
      const c = inf.chosen;
      const seat = inf.seat;
      const isDealer = seat === this.kyoku;
      if (isDealer) dealerWon = true;
      const p = Y.payments(c.base, isDealer, inf.tsumo);
      const paoInfo = this.pao[seat];
      let paoSeat = null, paoMult = 0;
      if (c.yakumanNames && c.yakumanNames.includes('大三元') && paoInfo.dragon != null) { paoSeat = paoInfo.dragon; paoMult = 1; }
      if (c.yakumanNames && c.yakumanNames.includes('大四喜') && paoInfo.wind != null) { paoSeat = paoInfo.wind; paoMult = 2; }
      const honba = idx === 0 ? this.honba : 0;
      // 包：包の役満（大三元・大四喜）の分だけ包の人が責任を持つ。複合した残りの役満はふつうに払う
      const n = Math.max(1, c.yakuman || 0);
      const paoN = paoSeat != null ? paoMult : 0; // 大四喜はダブル役満なので2倍分
      const f = paoN / n;
      if (inf.tsumo) {
        const paoPay = Y.payments(8000 * paoN, isDealer, true);
        const restPay = Y.payments(c.base - 8000 * paoN, isDealer, true);
        const paoChipPer = c.chipsDetail.yakumanPart * f;
        for (let s = 0; s < 4; s++) {
          if (s === seat) continue;
          const isD = s === this.kyoku;
          const paoPts = paoN ? (isD ? paoPay.fromDealer : paoPay.fromOthers) : 0;
          const restPts = isD ? restPay.fromDealer : restPay.fromOthers;
          const hb = honba * HONBA_POINTS / 3;
          if (paoSeat == null) { pay(s, seat, restPts + hb, c.chips); continue; }
          if (f >= 1) { pay(paoSeat, seat, paoPts + hb, c.chips); continue; } // 包だけの役満：全部包の人
          pay(paoSeat, seat, paoPts, paoChipPer);
          pay(s, seat, restPts + hb, c.chips - paoChipPer);
        }
      } else {
        const hb = honba * HONBA_POINTS;
        if (paoSeat != null && paoSeat !== inf.from) {
          const paoPts = Y.payments(8000 * paoN, isDealer, false).ron;
          const restPts = p.ron - paoPts;
          const paoChips = c.chipsDetail.yakumanPart * f / 2;
          pay(paoSeat, seat, paoPts / 2, paoChips);
          pay(inf.from, seat, paoPts / 2 + restPts + hb, c.chips - paoChips);
        } else {
          pay(inf.from, seat, p.ron + hb, c.chips);
        }
      }
      if (idx === 0) {
        delta[seat] += this.kyotaku * 1000;
        chipDelta[seat] += this.kyotakuChips;
      }
      const hand = sortTiles((inf.tsumo ? this.hands[seat] : this.hands[seat]).filter(t => t !== inf.tile));
      wins.push({
        seat, from: inf.from, tsumo: inf.tsumo, tile: inf.tile, wild: inf.wild, hand,
        melds: this.melds[seat].map(m => ({ ...m, tiles: m.tiles.slice() })),
        han: c.han, fu: c.fu, yaku: c.yaku, limit: c.limit, yakuman: c.yakuman, desc: c.desc,
        points: this.pointsText(c.base, isDealer, inf.tsumo), chips: c.chips, units: c.units,
        chipsDetail: { special: c.chipsDetail.special, separate: c.chipsDetail.separate, oneHan: c.chipsDetail.oneHan },
        pao: paoSeat, dora: (c.ind || inf.indicators).omote, ura: (c.ind || inf.indicators).ura, wildKind: c.wildKind != null ? c.wildKind : null,
      });
    });
    this.kyotaku = 0;
    this.kyotakuChips = 0;
    this.finishHand({ type: 'agari', wins, delta, chipDelta, busters }, { dealerWon, draw: false });
  }

  pointsText(base, isDealer, tsumo) {
    const p = Y.payments(base, isDealer, tsumo);
    if (!tsumo) return `${p.ron}点`;
    if (isDealer) return `${p.fromOthers}点オール`;
    return `${p.fromOthers}-${p.fromDealer}点`;
  }

  // 手牌だけの祝儀（流し満貫用、R-35）
  handChips(seat) {
    const ids = this.hands[seat].concat(this.melds[seat].flatMap(m => m.tiles));
    const units = [];
    for (const t of ids) {
      const fc = R.fiveColor(t);
      if (fc === 'rainbow') units.push('rainbow_' + R.SUIT_OF_FIVE[kindOf(t)]);
      else if (fc) units.push(fc);
      else if (this.pocchiOf(t)) units.push('pocchi');
    }
    // ドラ表示牌が特殊な5なら、手牌の6も色の付いた牌として数える（R-31）
    const have = new Set(units.filter(u => u.startsWith('rainbow_')).map(u => u.slice(8)));
    const omote = this.omoteIndicators();
    for (const suit of ['m', 'p', 's']) {
      const sixes = ids.filter(t => kindOf(t) === R.SIX_KIND[suit]);
      if (!sixes.length) continue;
      const srcs = omote.filter(t => kindOf(t) === R.FIVE_KIND[suit]).map(t => R.fiveColor(t));
      const plain = srcs.filter(c => c !== 'rainbow');
      const rb = srcs.includes('rainbow') && !have.has(suit);
      sixes.forEach((t, i) => {
        if (i === 0 && rb) { units.push('rainbow_' + suit); have.add(suit); }
        for (const c of plain) units.push(c);
      });
    }
    const sp = R.specialChips(units);
    return sp.sum * sp.mult;
  }

  exhaustiveDraw() {
    const tenpai = [0, 1, 2, 3].map(s => this.waitsOf(s).length > 0);
    const delta = [0, 0, 0, 0];
    const chipDelta = [0, 0, 0, 0];
    const busters = {};
    // 流し満貫（倍満、ツモ払い）
    const nagashi = [0, 1, 2, 3].filter(s => this.discards[s].length > 0 && this.discards[s].every(d => isYaochuKind(kindOf(d.tile)) && !d.called) && this.melds[s].length === 0);
    let reason = '流局';
    if (nagashi.length) {
      reason = '流し満貫';
      for (const s of nagashi) {
        const p = Y.payments(4000, s === this.kyoku, true);
        const ch = this.handChips(s);
        for (let o = 0; o < 4; o++) {
          if (o === s) continue;
          const pts = o === this.kyoku ? p.fromDealer : p.fromOthers;
          delta[o] -= pts; delta[s] += pts;
          chipDelta[o] -= ch; chipDelta[s] += ch;
          if (!(o in busters)) busters[o] = s;
        }
      }
      // 供託は流し満貫の人がもらう（2人以上なら親の下家から順に近い人。親は最後）
      const getter = [1, 2, 3, 0].map(i => (this.kyoku + i) % 4).find(x => nagashi.includes(x));
      delta[getter] += this.kyotaku * 1000;
      chipDelta[getter] += this.kyotakuChips;
      this.kyotaku = 0;
      this.kyotakuChips = 0;
    } else {
      const n = tenpai.filter(Boolean).length;
      if (n > 0 && n < 4) for (let s = 0; s < 4; s++) delta[s] = tenpai[s] ? 3000 / n : -3000 / (4 - n);
    }
    const hands = tenpai.map((t, s) => t ? sortTiles(this.hands[s]) : null);
    this.finishHand({ type: 'ryuukyoku', reason, nagashi, tenpai, hands, melds: this.melds.map((ms, i) => tenpai[i] ? ms.map(m => ({ ...m, tiles: m.tiles.slice() })) : []), delta, chipDelta, busters }, { dealerWon: false, draw: true, dealerTenpai: tenpai[this.kyoku] || nagashi.includes(this.kyoku) });
  }

  finishHand(result, info) {
    for (let s = 0; s < 4; s++) { this.scores[s] += result.delta[s]; this.chips[s] += result.chipDelta[s]; }
    result.title = this.message;
    // トビ（B-18）：飛ばした人に10枚。ノーテン罰符でのトビは支払いなし
    const busted = [0, 1, 2, 3].filter(s => this.scores[s] < 0);
    result.bust = [];
    for (const b of busted) {
      const to = result.busters[b];
      if (to != null && to !== b) {
        this.chips[b] -= 10; this.chips[to] += 10;
        result.chipDelta[b] -= 10; result.chipDelta[to] += 10;
      }
      result.bust.push(b);
    }
    // コールド（B-17）
    const cold = [0, 1, 2, 3].filter(s => this.scores[s] >= COLD_POINTS);
    // 2人以上なら、点数が一番高い人だけがもらう（同点は起家に近い人）
    const coldWinner = cold.length ? this.rankOrder().find(s => cold.includes(s)) : null;
    if (coldWinner != null) for (const c of [coldWinner]) for (let s = 0; s < 4; s++) if (s !== c) {
      this.chips[s] -= 5; this.chips[c] += 5;
      result.chipDelta[s] -= 5; result.chipDelta[c] += 5;
    }
    result.cold = cold;
    delete result.busters;
    this.result = result;
    this.phase = 'result';
    this.ready = new Set();
    if (busted.length || cold.length) { result.endReason = busted.length ? 'トビ' : 'コールド'; this.endGame(); }
    else if (info.dealerWon || (info.draw && info.dealerTenpai)) {
      result.needDealerChoice = true;
      result.dealerChoiceMade = false;
      result.dealerDeadline = Date.now() + CHOICE_SECONDS * 1000;
    } else {
      // 親が流れる：子の和了は0本場、親ノーテンは+1本場
      const honba = info.draw ? this.honba + 1 : 0;
      if (this.kyoku === 3) this.endGame();
      else this.nextState = { kyoku: this.kyoku + 1, honba };
    }
    result.scores = this.scores.slice();
    result.chips = this.chips.slice();
  }

  // 親の選択（B-19）
  dealerDecide(cont) {
    const r = this.result;
    if (!r || !r.needDealerChoice || r.dealerChoiceMade) return;
    r.dealerChoiceMade = true;
    r.dealerContinue = cont;
    if (cont) this.nextState = { kyoku: this.kyoku, honba: this.honba + 1 };
    else if (this.kyoku === 3) { r.endReason = '親が流して終局'; this.endGame(); }
    else this.nextState = { kyoku: this.kyoku + 1, honba: 0 };
    r.scores = this.scores.slice();
    r.chips = this.chips.slice();
  }

  endGame() {
    const top = this.rankOrder()[0];
    this.scores[top] += this.kyotaku * 1000;
    this.chips[top] += this.kyotakuChips;
    this.kyotaku = 0; this.kyotakuChips = 0;
    const final = this.rankOrder();
    final.forEach((seat, i) => { this.chips[seat] += RANK_CHIPS[i]; });
    this.gameOver = final.map((seat, i) => ({
      seat, name: this.players[seat].name, score: this.scores[seat], rank: i + 1,
      rankChips: RANK_CHIPS[i], chips: this.chips[seat],
    }));
    if (this.result) { this.result.scores = this.scores.slice(); this.result.chips = this.chips.slice(); }
  }

  rankOrder() {
    return [0, 1, 2, 3].sort((a, b) => this.scores[b] - this.scores[a] || a - b);
  }

  tryNextHand() {
    if (this.gameOver) return;
    if (this.result && this.result.needDealerChoice && !this.result.dealerChoiceMade) return;
    if (this.ready.size < 4) return;
    this.kyoku = this.nextState.kyoku;
    this.honba = this.nextState.honba;
    this.startHand();
  }

  // ============ 表示用データ ============
  viewFor(seat) {
    const base = {
      you: seat,
      players: this.players.map((p, i) => ({
        name: p.name, isBot: !!p.isBot, away: !!p.away, score: this.scores[i], chips: this.chips[i],
        wind: WIND_NAMES[(i - this.kyoku + 4) % 4], riichi: this.riichi[i].state > 0, open: this.riichi[i].open,
        openWaits: this.openShown(i) && this.phase !== 'result' ? this.openWaitInfo(i).waits : null,
        openShape: this.openShown(i) && this.phase !== 'result' ? this.openWaitInfo(i).shape : null,
        handCount: this.hands[i].length,
      })),
      round: { wind: '東', kyoku: this.kyoku + 1, honba: this.honba, kyotaku: this.kyotaku, kyotakuChips: this.kyotakuChips, dealer: this.kyoku, title: this.message },
      gid: this.gid,
      noCall: !!(seat >= 0 && this.noCall[seat]), // 鳴きなし（サーバーの状態を画面のチェックに合わせる）
      wall: this.live.length,
      dora: this.omoteIndicators(),
      pocchiKinds: [...this.pocchiKinds],
      hand: seat >= 0 ? this.hands[seat].filter(t => t !== this.drawn || this.turn !== seat) : null,
      drawn: seat >= 0 && this.turn === seat && this.drawn != null && this.hands[seat].includes(this.drawn) ? this.drawn : null,
      melds: this.melds,
      discards: this.discards,
      turn: this.turn,
      phase: this.phase,
      lastDiscard: this.lastDiscard,
      actions: seat >= 0 ? this.actionsFor(seat) : null,
      waits: seat >= 0 && this.phase !== 'result' && this.hands[seat].length % 3 === 1 ? this.waitsOf(seat) : [],
      waitsLeft: seat >= 0 && this.phase !== 'result' && this.hands[seat].length % 3 === 1 ? this.waitsWithLeft(this.waitsOf(seat), this.visibleCounts()) : [],
      discardWaits: seat >= 0 && this.phase === 'discard' && this.turn === seat && this.hands[seat].length % 3 === 2 ? this.discardWaits(seat) : null,
      furiten: seat >= 0 && this.hands[seat].length % 3 === 1 ? this.isFuriten(seat) : false,
      claimTile: this.phase === 'claim' && this.claim ? this.claim.tile : null,
      result: this.phase === 'result' ? this.result : null,
      ready: [...(this.ready || [])],
      gameOver: this.phase === 'result' ? this.gameOver : null,
      aka: true,
    };
    if (this.phase === 'choose' && this.choose) {
      base.choose = {
